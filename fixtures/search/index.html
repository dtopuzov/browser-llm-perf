<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Search</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 48rem; padding: 0 1rem; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; padding: 0.65rem; }
      button { padding: 0.65rem 1rem; }
      li { margin: 1rem 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Knowledge Search</h1>
      <form id="search-form" role="search">
        <label for="query">Search the knowledge base</label>
        <input id="query" name="query" type="search" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <section id="results" aria-live="polite" hidden>
        <h2>Search results</h2>
        <ol>
          <li><a href="/articles/telerik.html">Telerik</a><p>Software company known for developer tools.</p></li>
          <li><a href="/articles/kendo-ui.html">Kendo UI</a><p>A JavaScript component library.</p></li>
          <li><a href="/articles/progress-software.html">Progress Software</a><p>Enterprise software provider.</p></li>
        </ol>
      </section>
      <p id="empty" role="status" hidden>No results found.</p>
    </main>
    <script>
      const form = document.querySelector('#search-form');
      const query = document.querySelector('#query');
      const results = document.querySelector('#results');
      const empty = document.querySelector('#empty');
      form.addEventListener('submit', event => {
        event.preventDefault();
        const matches = query.value.trim().toLowerCase().includes('telerik');
        results.hidden = !matches;
        empty.hidden = matches;
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deployment status</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 36rem; padding: 0 1rem; }
      button { padding: 0.7rem 1rem; }
      #status { margin-top: 1.25rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Deployment status</h1>
      <button id="check" type="button">Check deployment</button>
      <p id="status" role="status" hidden>Deployment is healthy</p>
    </main>
    <script>
      const button = document.querySelector('#check');
      const status = document.querySelector('#status');
      button.addEventListener('click', () => {
        button.disabled = true;
        setTimeout(() => { status.hidden = false; }, 450);
      });
    </script>
  </body>
</html>
